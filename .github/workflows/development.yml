name: Build Development
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Upstream branch (empty: develop)'
        required: false
        default: ''

jobs:
  update_create_pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Get current stable version
      id: get_version
      run: echo "version=$(<webtop5-build/VERSION)" >> "$GITHUB_OUTPUT"
    - name: Get current date
      id: get_date
      run: |
        export TZ=Europe/Rome
        echo "current=$(date +%Y%m%d-%H%M%S-%Z)" >> "$GITHUB_OUTPUT"
    - name: Set development version
      run: echo "development-${{ steps.get_date.outputs.current }}" > webtop5-build/VERSION
    - name: Set upstream branch
      env:
        BRANCH: ${{ github.event.inputs.branch }}
      run: |
        if [ -n "$BRANCH" ]; then
          echo "$BRANCH" > webtop5-build/BRANCH
        else
          rm -f webtop5-build/BRANCH
        fi
    - name: Create/Update pull request
      uses: peter-evans/create-pull-request@v8
      with:
        branch: ${{ steps.get_version.outputs.version }}-next
        title: Update to upstream release ${{ steps.get_version.outputs.version }}-next
        body: ''
        commit-message: Update development war ${{ steps.get_date.outputs.current }}
        draft: true
        token: ${{ secrets.webtop_pr }}
