<Location "/.well-known/caldav">
  Redirect 301 "%{HTTP:X-Forwarded-Proto}://%{HTTP:X-Forwarded-Host}/webtop-dav/server.php/"
</Location>

<Location "/.well-known/carddav">
  Redirect 301 "%{HTTP:X-Forwarded-Proto}://%{HTTP:X-Forwarded-Host}/webtop-dav/server.php/"
</Location>

Alias /webtop-dav/ /usr/share/webtop/webdav/
<Directory "/usr/share/webtop/webdav/">
    # Ignore the bundled .htaccess: it could pass PHP settings to FPM.
    # Its directives are copied here.
    AllowOverride None
    Require all granted
    AddDefaultCharset utf-8
    Options FollowSymLinks
    DirectoryIndex server.php
    # Prevents error 412 PreconditionFailed
    RequestHeader unset If-Match
    RequestHeader unset If-None-Match

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://localhost:9000"
    </FilesMatch>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</Directory>
