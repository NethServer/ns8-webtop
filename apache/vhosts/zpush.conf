Alias /Microsoft-Server-ActiveSync /usr/share/webtop/z-push/index.php

# A phone waits in Ping for up to 3540 s (ActiveSync's maximum heartbeat):
# give Z-Push that long plus 2 minutes, instead of Apache's 60 s Timeout.
# The worker matches the SetHandler URLs below and in zfaker.conf.
<Proxy "fcgi://localhost:9001">
    ProxySet timeout=3660
</Proxy>

<Directory "/usr/share/webtop/z-push/">
   <FilesMatch \.php$>
        SetHandler "proxy:fcgi://localhost:9001"
    </FilesMatch>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    AllowOverride None
    Options None
    Require all granted
</Directory>
