; Mitigate CVE-2026-109618 / CVE-2026-109619 (use-after-free in the
; session upload progress handler). No WebTop container uses it.
session.upload_progress.enabled = Off
; PHP 8.5 only, older versions ignore it
fatal_error_backtraces = Off
; Keep request bodies small: no container takes browser file uploads
post_max_size = 8M
upload_max_filesize = 2M
