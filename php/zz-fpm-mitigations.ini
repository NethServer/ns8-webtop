; uploads at request start). WebDAV and Z-Push read php://input only.
enable_post_data_reading = Off
; Mitigate CVE-2026-109619: no per-directory INI files at request time.
; Settings the apps need are set in zz-webdav.ini instead.
user_ini.filename =
